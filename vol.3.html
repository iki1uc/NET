<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WURZEL NET · ATME · iki</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;background:#05070d;color:#e6eaf2;
    font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;
    font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
  #root{min-height:100vh}
  :root{--bg:#05070d;--panel:#0a0f19;--line:#243044;--fg:#e6eaf2;
    --mu:#7f8ca3;--dim:#6b7a93;--cyan:#00e5ff;--gold:#ffd700;--pink:#ff2d9a;
    --ok:#4dff9b;--violet:#a78bfa;--bad:#ff5974}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:#243044;border-radius:999px}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input[type="range"]{cursor:pointer}
  @keyframes breathePulse{0%,100%{opacity:.6}50%{opacity:1}}
  .breathe{animation:breathePulse 4s ease-in-out infinite}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const ZONES = [
  { id:"leben",   label:"LEBEN",   sub:"einatmen", verb:"atme ein", color:"#00e5ff", qi:[0,1,2] },
  { id:"mann",    label:"MANN",    sub:"halten",   verb:"halte",    color:"#ffd700", qi:[3,4,5] },
  { id:"unleben", label:"UNLEBEN", sub:"ausatmen", verb:"atme aus", color:"#ff2d9a", qi:[6,7,8] },
];

const SOURCES = [
  { vol:"v1", name:"wurzel.index.net.ter.link.ker",
    was:"netz geerdet in HOME · ringe → 40",
    wie:"3 ringe × n knoten → 1 bridge/ring",
    warum:"f²=f hält · einer macht netz" },
  { vol:"v2", name:"call.recall.call.back",
    was:"CALL push · RECALL peek · BACK home",
    wie:"f(x)=min(x,40) · stack → HOME",
    warum:"f²=f · fixpunkt 40" },
  { vol:"v2", name:"wurzel-hub.mann.dreckig",
    was:"7 pflichten · MANN zone 27–53",
    wie:"9×9=81 · HOME 40 im MANN",
    warum:"f²=f echt · 5/7 safe · 2/7 break" },
  { vol:"v2", name:"link.net.ter.ker.sys",
    was:"was/wie/warum ringe → home",
    wie:"R 110/210/310 · center 400,400",
    warum:"3→1 wurzel · fixpunkt hält" },
  { vol:"v2", name:"wurzel-hub.high-end",
    was:"ESSENZ / WURZEL729 / GRUNDREGEL",
    wie:"P0..P4 · 81 zellen · HOME 40",
    warum:"pipeline visual only" },
  { vol:"v1", name:"wurzel-net-ter-link (v1)",
    was:"wurzel-hub / bio.tel / pyramiden",
    wie:"9×40°=360° · 1-2-3-3 geflecht",
    warum:"5/7 safe · 2/7 break · f²=f echt" },
  { vol:"v2", name:"link.net.ter.ker",
    was:"3 ringe · link.ker overlay",
    wie:"home 40 center · 400,400",
    warum:"einer macht link · einer netz" },
  { vol:"v2", name:"wurzel-hub.kandidaten.korrigiert",
    was:"7 kandidaten · .chip.cy fixed",
    wie:"min(x,40) violett 2.5px · slider 60",
    warum:"verjüngt: f(x)≤x · ab 41 sichtbar" },
];

const KANDIDATEN = [
  { id:"min40",  label:"min(x,40)", color:"#a78bfa", thick:true,
    f2:true,  info:true,  verj:true,  grp:"brunnen", note:"verjüngt · fixpunkt 40" },
  { id:"max0",   label:"max(0,x)",  color:"#00e5ff", thick:false,
    f2:true,  info:true,  verj:false, grp:"brunnen", note:"ReLU · schützt vor negativ" },
  { id:"max18",  label:"max(18,x)", color:"#4dff9b", thick:false,
    f2:true,  info:true,  verj:false, grp:"brunnen", note:"hebt an · fixpunkt ab 18" },
  { id:"x-7",    label:"x − 7",     color:"#ff2d9a", thick:false,
    f2:false, info:true,  verj:false, grp:"abfluss", note:"abfluss · nie fixpunkt" },
  { id:"x/2",    label:"x / 2",     color:"#ff8c42", thick:false,
    f2:false, info:true,  verj:false, grp:"abfluss", note:"halbiert · wandert weiter" },
  { id:"sqrt",   label:"√x",        color:"#ffd700", thick:false,
    f2:false, info:true,  verj:false, grp:"abfluss", note:"wurzel · bricht f²=f" },
  { id:"const",  label:"konst 40",  color:"#7a7f8c", thick:false,
    f2:true,  info:false, verj:false, grp:"konst",   note:"ein wert · scheitert an info" },
];

const ROOT_RULES = [
  { k:"R1", t:"origin 40",   d:"f(40)=40 — HOME fixpunkt, Sonne. Alle Orbits starten hier." },
  { k:"R2", t:"grid 81",     d:"9×9=81 · qi(r,c)=9r+c · kein cell leer." },
  { k:"R3", t:"atme 3×3",    d:"LEBEN/MANN/UNLEBEN · 3×27=81 · einatmen/halten/ausatmen." },
  { k:"R4", t:"roots 9",     d:"9 wurzeln · pipe9=c · jede spalte ein root-kanal." },
  { k:"R5", t:"total 2187",  d:"81×9=729 · 729×3=2187=3^7." },
  { k:"R6", t:"iki oben",    d:"nie verdeckt · immer über allen anderen." },
  { k:"R7", t:"trennung",    d:"essenzen ∩ ganze = ∅ · nur schnitt." },
  { k:"R8", t:"fixpunkt",    d:"f²=f primary · f³=f weaker · f(40)=40 muss." },
  { k:"R9", t:"essenzen",    d:"V1∩V2∩V3 only — IN→IN→IN · nur intersection ist wahr." },
  { k:"R10", t:"nika unten", d:"schattengänger · läuft unter allem." },
];

function App() {
  const [rate, setRate] = useState(1.0);
  const [axiom, setAxiom] = useState(true);
  const [neon, setNeon] = useState(true);
  const [showIki, setShowIki] = useState(true);
  const [breath, setBreath] = useState({ phase:0, percent:0, breaths:0, peak:0 });
  const breathRef = useRef({ phase:0, percent:0, breaths:0, peak:0 });
  const canvasRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let raf = 0;
    const startTime = performance.now();
    let breathCount = 0;
    let lastBreathFloor = 0;

    const W = 800, H = 800, cx = 400, cy = 400;
    const DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = "100%";
    canvas.style.aspectRatio = "1/1";
    ctx.scale(DPR, DPR);

    const NUM = 9;
    const rBase = 130, rTip = 180, triHalfW = 22;
    const ringR = [210, 250, 290];
    const ringC = ["#00e5ff", "#ffd700", "#ff2d9a"];

    const draw = (now) => {
      const elapsed = (now - startTime) / 1000;
      const breathsPerSec = rate / 10;
      const totalPhase = elapsed * breathsPerSec;
      const breathT = totalPhase % 1;

      if (totalPhase - lastBreathFloor >= 1) {
        breathCount = Math.floor(totalPhase);
        lastBreathFloor = breathCount;
      }

      const phaseIdx = Math.floor(breathT * 3);
      const peakIdx = Math.floor(breathT * NUM);
      breathRef.current = {
        phase: phaseIdx,
        percent: Math.round(breathT * 100),
        breaths: breathCount,
        peak: peakIdx,
      };

      // Background
      ctx.fillStyle = "#05070d";
      ctx.fillRect(0, 0, W, H);
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 420);
      grad.addColorStop(0, "rgba(10,15,25,0.55)");
      grad.addColorStop(0.7, "rgba(5,7,13,0.25)");
      grad.addColorStop(1, "rgba(5,7,13,0)");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      // Grid
      ctx.strokeStyle = "rgba(36,48,68,0.14)";
      ctx.lineWidth = 0.5;
      for (let r = 40; r <= 400; r += 40) {
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
      }

      // was/wie/warum rings
      ringR.forEach((r, i) => {
        ctx.strokeStyle = ringC[i] + "22";
        ctx.setLineDash([3, 8]);
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
      });
      ctx.setLineDash([]);

      // Rotation
      const rot = (elapsed * 3.6) % 360;

      // Draw 9 triangles with breathing wave
      for (let i = 0; i < NUM; i++) {
        const z = Math.floor(i / 3);
        const zone = ZONES[z];

        const triPhase = (breathT - i / NUM + 1) % 1;
        const triBreath = 0.5 + 0.5 * Math.cos(triPhase * Math.PI * 2);
        const intensity = 0.15 + 0.85 * triBreath;

        const ang = ((i * 40) + rot) * Math.PI / 180;
        const cos = Math.cos(ang), sin = Math.sin(ang);
        const perpX = -sin, perpY = cos;

        const tip = { x: cx + cos * rTip, y: cy + sin * rTip };
        const base = { x: cx + cos * rBase, y: cy + sin * rBase };
        const bL = { x: base.x + perpX * triHalfW, y: base.y + perpY * triHalfW };
        const bR = { x: base.x - perpX * triHalfW, y: base.y - perpY * triHalfW };

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(tip.x, tip.y);
        ctx.lineTo(bL.x, bL.y);
        ctx.lineTo(bR.x, bR.y);
        ctx.closePath();

        if (neon) {
          ctx.shadowColor = zone.color;
          ctx.shadowBlur = 6 + intensity * 32;
        }

        const alphaHex = Math.round(intensity * 255).toString(16).padStart(2, "0");
        ctx.fillStyle = zone.color + alphaHex;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = zone.color;
        ctx.lineWidth = 0.8 + intensity * 1.3;
        ctx.stroke();
        ctx.restore();

        // qi label
        const lx = cx + cos * (rTip + 22);
        const ly = cy + sin * (rTip + 22);
        const isPeak = triBreath > 0.85;
        ctx.fillStyle = isPeak ? "#ffffff" : zone.color + "88";
        ctx.font = `${isPeak ? "700" : "500"} 10px 'JetBrains Mono', monospace`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(String(i), lx, ly);
      }

      // Axiom axis lines (R3 structure)
      if (axiom) {
        ctx.strokeStyle = "rgba(0,229,255,0.12)";
        ctx.lineWidth = 0.7;
        for (let i = 0; i < NUM; i++) {
          const a = ((i * 40) + rot) * Math.PI / 180;
          const b = (((i + 3) % NUM) * 40 + rot) * Math.PI / 180;
          ctx.beginPath();
          ctx.moveTo(cx + Math.cos(a) * rTip, cy + Math.sin(a) * rTip);
          ctx.lineTo(cx + Math.cos(b) * rTip, cy + Math.sin(b) * rTip);
          ctx.stroke();
        }
      }

      // HOME 40 fixpunkt
      const homeB = 0.5 + 0.5 * Math.sin(breathT * Math.PI * 2);
      ctx.beginPath();
      ctx.arc(cx, cy, 40 + homeB * 4, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,215,0,0.10)";
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx, cy, 26, 0, Math.PI * 2);
      ctx.fillStyle = "#ffd700";
      ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = "#05070d";
      ctx.font = "700 14px 'JetBrains Mono', monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("40", cx, cy);

      // Verb under home
      const verb = ZONES[phaseIdx].verb;
      ctx.fillStyle = "#ffd700";
      ctx.font = "600 9px 'JetBrains Mono', monospace";
      ctx.fillText("HOME", cx, cy - 42);
      ctx.fillStyle = "rgba(255,215,0,0.7)";
      ctx.font = "500 8px 'JetBrains Mono', monospace";
      ctx.fillText(verb, cx, cy + 44);

      // iki — top
      if (showIki) {
        const ikiY = 50;
        const ikiB = 0.5 + 0.5 * Math.sin(elapsed * 1.2);
        ctx.beginPath();
        ctx.arc(cx, ikiY, 26 + ikiB * 4, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(77,255,155,0.16)";
        ctx.fill();
        ctx.strokeStyle = "#4dff9b";
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 3]);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = "#4dff9b";
        ctx.font = "700 12px 'JetBrains Mono', monospace";
        ctx.fillText("iki", cx, ikiY - 2);
        ctx.font = "600 7px 'JetBrains Mono', monospace";
        ctx.fillStyle = "rgba(200,255,220,0.85)";
        ctx.fillText("oben", cx, ikiY + 12);
      }

      // nika — bottom walker
      const nikaX = ((elapsed * 70) % (W + 60)) - 30;
      const nikaY = H - 28;
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.beginPath();
      ctx.ellipse(nikaX, nikaY + 6, 9, 2.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(255,45,154,0.9)";
      ctx.lineWidth = 2;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(nikaX, nikaY - 6);
      ctx.lineTo(nikaX, nikaY);
      ctx.moveTo(nikaX - 4, nikaY - 13);
      ctx.lineTo(nikaX, nikaY - 6);
      ctx.lineTo(nikaX + 4, nikaY - 13);
      ctx.stroke();
      ctx.fillStyle = "#ff2d9a";
      ctx.beginPath();
      ctx.arc(nikaX, nikaY - 17, 2.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.font = "500 7px 'JetBrains Mono', monospace";
      ctx.fillStyle = "rgba(255,45,154,0.65)";
      ctx.textAlign = "center";
      ctx.fillText("nika", nikaX, nikaY - 24);

      // Zone labels
      ZONES.forEach((z, zi) => {
        const za = (zi * 120 + 60 + rot) * Math.PI / 180;
        const zx = cx + Math.cos(za) * 340;
        const zy = cy + Math.sin(za) * 340;
        const active = phaseIdx === zi;
        ctx.fillStyle = active ? z.color : z.color + "60";
        ctx.font = `${active ? "700" : "500"} 12px 'JetBrains Mono', monospace`;
        ctx.textAlign = "center";
        ctx.fillText(z.label, zx, zy);
        ctx.font = "500 8px 'JetBrains Mono', monospace";
        ctx.fillStyle = z.color + "80";
        ctx.fillText(z.sub, zx, zy + 13);
      });

      // Top-left stats
      ctx.fillStyle = "rgba(201,214,232,0.7)";
      ctx.font = "500 10px 'JetBrains Mono', monospace";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText(`t ${breathT.toFixed(2)} · ${(breathT*100).toFixed(0)}%`, 16, 16);
      ctx.fillText(`f²=f ✓ · 81 = 9×9`, 16, 32);
      ctx.fillText(`breaths ${breathCount}`, 16, 48);

      // Bottom-right
      ctx.textAlign = "right";
      ctx.textBaseline = "bottom";
      ctx.fillStyle = "rgba(122,138,168,0.6)";
      ctx.fillText(`∠ ${rot.toFixed(0)}°`, W - 16, H - 16);
      ctx.fillText("52.52°N · 13.40°E", W - 16, H - 32);

      raf = requestAnimationFrame(draw);
    };

    raf = requestAnimationFrame(draw);
    return () => cancelAnimationFrame(raf);
  }, [rate, axiom, neon, showIki]);

  useEffect(() => {
    const id = setInterval(() => {
      setBreath({ ...breathRef.current });
    }, 150);
    return () => clearInterval(id);
  }, []);

  const phase = ZONES[breath.phase] || ZONES[0];

  return (
    <div style={{maxWidth:1180,margin:"0 auto",padding:"14px"}}>
      <header style={{padding:"16px 20px",border:"1px solid var(--line)",borderRadius:16,
        background:"linear-gradient(180deg,rgba(10,15,25,0.95),rgba(5,9,18,0.92))",
        marginBottom:12,position:"relative",overflow:"hidden"}}>
        <div style={{position:"absolute",top:0,left:0,right:0,height:1,
          background:"linear-gradient(90deg,transparent,rgba(255,215,0,0.4),rgba(0,229,255,0.35),rgba(255,45,154,0.3),transparent)"}}/>
        <div style={{display:"flex",flexWrap:"wrap",gap:12,alignItems:"baseline",justifyContent:"space-between"}}>
          <div>
            <h1 style={{margin:0,fontSize:22,letterSpacing:"0.14em",color:"var(--gold)",
              fontFamily:"Space Grotesk, system-ui, sans-serif",fontWeight:700}}>
              WURZEL NET · <span style={{color:phase.color,transition:"color 0.6s"}}>ATME</span>
            </h1>
            <div style={{marginTop:6,fontSize:10,letterSpacing:"0.18em",color:"var(--dim)"}}>
              LEBEN · MANN · UNLEBEN · f³=f²·f=f · HOME 40 · iki oben · nika unten
            </div>
          </div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            <span className="chip" style={chip("gold")}>HOME 40</span>
            <span className="chip" style={chip("violet")}>f³=f²·f=f</span>
            <span className="chip" style={chip("cyan")}>8×3 = 24 essenzen</span>
            <span className="chip" style={chip("ok")}>81 = 9×9 = 3⁴</span>
            <span className="chip" style={chip("pink")}>2187 = 3⁷</span>
          </div>
        </div>
      </header>

      <div style={{display:"grid",gridTemplateColumns:"1fr",gap:12,
        gridAutoRows:"auto"}} className="main-grid">
        <div style={{display:"grid",gap:12,gridTemplateColumns:"minmax(0,1.4fr) minmax(280px,1fr)",
          alignItems:"start"}} className="canvas-grid">
          <div className="card" style={{padding:10}}>
            <canvas ref={canvasRef} style={{display:"block",borderRadius:10,background:"#05070d"}}/>
            <div style={{marginTop:10,padding:"6px 4px",fontSize:10,color:"var(--dim)",
              display:"flex",flexWrap:"wrap",gap:"4px 12px",borderTop:"1px solid var(--line)"}}>
              <span>● LEBEN 0-2</span>
              <span>● MANN 3-5</span>
              <span>● UNLEBEN 6-8</span>
              <span style={{color:phase.color,fontWeight:700,transition:"color 0.6s"}}>
                ▲ peak qi = {breath.peak}
              </span>
              <span style={{marginLeft:"auto"}}>atme #{breath.breaths}</span>
            </div>
          </div>

          <aside style={{display:"flex",flexDirection:"column",gap:10}}>
            <div className="card">
              <h3 style={{margin:"0 0 10px",fontSize:10,letterSpacing:"0.2em",
                color:"var(--dim)",textTransform:"uppercase"}}>
                ATME · {phase.label}
              </h3>
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:4}}>
                {ZONES.map((z, i) => {
                  const active = breath.phase === i;
                  return (
                    <div key={z.id} style={{
                      padding:"8px 6px",border:`1px solid ${active ? z.color : "var(--line)"}`,
                      borderRadius:8,background:active ? z.color + "15" : "transparent",
                      transition:"all 0.3s",
                    }}>
                      <div style={{fontSize:9,letterSpacing:"0.14em",color:z.color,
                        fontWeight:active ? 700 : 500}}>{z.label}</div>
                      <div style={{fontSize:8,color:"var(--dim)",marginTop:2}}>{z.sub}</div>
                      {active && <div style={{marginTop:6,height:2,background:z.color,
                        borderRadius:2,animation:"breathePulse 1s infinite"}}/>}
                    </div>
                  );
                })}
              </div>
              <div style={{marginTop:12,height:6,background:"#0a0f19",borderRadius:4,
                border:"1px solid var(--line)",overflow:"hidden",position:"relative"}}>
                <div style={{position:"absolute",left:0,top:0,height:"100%",
                  width:`${breath.percent}%`,
                  background:`linear-gradient(90deg,${phase.color}88,${phase.color})`,
                  transition:"width 0.15s linear"}}/>
              </div>
              <div style={{display:"flex",justifyContent:"space-between",
                marginTop:4,fontSize:9,color:"var(--dim)"}}>
                <span>0%</span>
                <span style={{color:phase.color,fontWeight:700}}>{breath.percent}%</span>
                <span>100%</span>
              </div>
            </div>

            <div className="card">
              <h3 style={{margin:"0 0 10px",fontSize:10,letterSpacing:"0.2em",
                color:"var(--dim)",textTransform:"uppercase"}}>STATUS</h3>
              {[
                ["breaths", breath.breaths],
                ["phase", phase.label],
                ["peak qi", breath.peak],
                ["f(40)", "40 ✓"],
                ["81", "9×9 ✓"],
                ["essenzen", "8×3=24"],
                ["ganze dateien", "0"],
              ].map(([k, v]) => (
                <div key={k} style={{display:"flex",justifyContent:"space-between",
                  padding:"3px 0",fontSize:11,borderBottom:"1px dashed rgba(36,48,68,0.5)"}}>
                  <span style={{color:"var(--dim)"}}>{k}</span>
                  <b style={{color:"var(--fg)"}}>{v}</b>
                </div>
              ))}
            </div>

            <div className="card">
              <h3 style={{margin:"0 0 10px",fontSize:10,letterSpacing:"0.2em",
                color:"var(--dim)",textTransform:"uppercase"}}>ATEM · RATE</h3>
              <div style={{display:"flex",justifyContent:"space-between",
                alignItems:"center",marginBottom:8,fontSize:11}}>
                <span style={{color:"var(--dim)"}}>{(rate*10).toFixed(1)}s / atemzug</span>
                <b style={{color:phase.color,fontSize:14}}>{rate.toFixed(2)}×</b>
              </div>
              <input type="range" min="0.2" max="3" step="0.05" value={rate}
                onChange={(e)=>setRate(parseFloat(e.target.value))}
                style={{width:"100%",accentColor:"#ffd700"}}/>
            </div>

            <div className="card">
              <h3 style={{margin:"0 0 10px",fontSize:10,letterSpacing:"0.2em",
                color:"var(--dim)",textTransform:"uppercase"}}>MODI</h3>
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                <Toggle label="AXIOM 3×27" value={axiom} onChange={setAxiom} color="#00e5ff"/>
                <Toggle label="NEON GLOW" value={neon} onChange={setNeon} color="#ff2d9a"/>
                <Toggle label="iki OBEN" value={showIki} onChange={setShowIki} color="#4dff9b"/>
              </div>
            </div>
          </aside>
        </div>
      </div>

      {/* 8 Quellen × 3 Essenzen */}
      <section className="card" style={{marginTop:12}}>
        <h3 style={{margin:"0 0 14px",fontSize:11,letterSpacing:"0.22em",
          color:"var(--cyan)",textTransform:"uppercase",fontWeight:700}}>
          8 QUELLEN · 3 ESSENZEN JE · NIE DAS GANZE
        </h3>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(240px,1fr))",gap:10}}>
          {SOURCES.map((s, i) => (
            <div key={i} style={{padding:"10px 12px",border:"1px solid var(--line)",
              borderRadius:10,background:"#050912"}}>
              <div style={{display:"flex",justifyContent:"space-between",
                alignItems:"center",marginBottom:6,paddingBottom:6,
                borderBottom:"1px dashed rgba(36,48,68,0.6)"}}>
                <div style={{fontSize:11,color:"var(--fg)",fontWeight:700,overflow:"hidden",
                  textOverflow:"ellipsis",whiteSpace:"nowrap",minWidth:0}}>
                  {String(i+1).padStart(2,"0")} · {s.name}
                </div>
                <div style={{fontSize:8,color:"var(--dim)",letterSpacing:"0.1em",
                  textTransform:"uppercase",marginLeft:6,flexShrink:0}}>{s.vol}</div>
              </div>
              {[["was",s.was,"var(--cyan)"],["wie",s.wie,"var(--gold)"],["warum",s.warum,"var(--pink)"]]
                .map(([k, txt, c]) => (
                <div key={k} style={{display:"grid",gridTemplateColumns:"44px 1fr",
                  gap:8,fontSize:10,padding:"2px 0",lineHeight:1.5}}>
                  <div style={{fontWeight:700,color:c}}>{k}</div>
                  <div style={{color:"#b0bcc9"}}>{txt}</div>
                </div>
              ))}
            </div>
          ))}
        </div>
      </section>

      {/* 7 Kandidaten */}
      <section className="card" style={{marginTop:12}}>
        <h3 style={{margin:"0 0 14px",fontSize:11,letterSpacing:"0.22em",
          color:"var(--violet)",textTransform:"uppercase",fontWeight:700}}>
          7 KANDIDATEN · min(x,40) violett 2.5px · f²=f ∧ Info ∧ verjüngt
        </h3>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(160px,1fr))",gap:8}}>
          {KANDIDATEN.map(c => {
            const isMin = c.id === "min40";
            return (
              <div key={c.id} style={{
                padding:"8px 10px",
                border:`${isMin ? "1.5px" : "1px"} solid ${isMin ? c.color : "var(--line)"}`,
                borderRadius:8,
                background: isMin ? "rgba(167,139,250,0.08)" : "#050912"
              }}>
                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
                  <span style={{display:"inline-block",width:isMin?14:10,height:isMin?4:3,
                    background:c.color,borderRadius:2}}/>
                  <span style={{fontSize:11,fontWeight:700,color:"var(--fg)"}}>{c.label}</span>
                </div>
                <div style={{fontSize:9,color:"var(--dim)",marginBottom:6}}>{c.note}</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                  <span style={{padding:"1px 6px",fontSize:8,borderRadius:999,
                    border:`1px solid ${c.f2 ? "rgba(77,255,155,0.4)" : "rgba(255,89,116,0.4)"}`,
                    background:c.f2 ? "rgba(77,255,155,0.08)" : "rgba(255,89,116,0.06)",
                    color:c.f2 ? "var(--ok)" : "var(--bad)"}}>
                    f²=f {c.f2 ? "✓" : "✗"}
                  </span>
                  <span style={{padding:"1px 6px",fontSize:8,borderRadius:999,
                    border:`1px solid ${c.info ? "rgba(255,215,0,0.4)" : "rgba(255,215,0,0.2)"}`,
                    color:"var(--gold)"}}>info {c.info ? "✓" : "✗"}</span>
                  {c.verj && (
                    <span style={{padding:"1px 6px",fontSize:8,borderRadius:999,
                      border:"1px solid rgba(167,139,250,0.5)",color:"var(--violet)"}}>verjüngt</span>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </section>

      {/* ROOT_RULES R1-R10 */}
      <section className="card" style={{marginTop:12}}>
        <h3 style={{margin:"0 0 14px",fontSize:11,letterSpacing:"0.22em",
          color:"var(--gold)",textTransform:"uppercase",fontWeight:700}}>
          ROOT_RULES R1–R10 · ESSENZ
        </h3>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:10}}>
          {ROOT_RULES.map(r => (
            <div key={r.k} style={{padding:"10px 12px",border:"1px solid var(--line)",
              borderRadius:8,background:"#050912"}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                <span style={{padding:"2px 8px",fontSize:10,fontWeight:700,
                  background:"rgba(255,215,0,0.1)",color:"var(--gold)",
                  border:"1px solid rgba(255,215,0,0.35)",borderRadius:999}}>{r.k}</span>
                <span style={{fontSize:11,fontWeight:700,color:"var(--fg)"}}>{r.t}</span>
              </div>
              <div style={{fontSize:10,color:"var(--mu)",lineHeight:1.55}}>{r.d}</div>
            </div>
          ))}
        </div>
      </section>

      <footer style={{marginTop:14,padding:"14px 4px",textAlign:"center",
        fontSize:9,letterSpacing:"0.14em",color:"var(--dim)",lineHeight:1.8}}>
        WURZEL NET · ATME · LEBEN / MANN / UNLEBEN · f³=f²·f=f · HOME 40 ·
        8 Quellen × 3 Essenzen · 81 = 9×9 · 2187 = 3⁷ · iki oben · nika unten ·
        Berlin 52.52°N · einer macht netz · nur essenzen nie ganze
      </footer>

      <style>{`
        @media(max-width:820px){
          .canvas-grid{grid-template-columns:1fr !important}
        }
      `}</style>
    </div>
  );
}

function Toggle({ label, value, onChange, color }) {
  return (
    <button onClick={() => onChange(!value)} style={{
      display:"flex", alignItems:"center", justifyContent:"space-between",
      padding:"6px 10px", borderRadius:6,
      border:`1px solid ${value ? color : "var(--line)"}`,
      background: value ? color + "15" : "transparent",
      fontSize:10, letterSpacing:"0.08em",
      color: value ? color : "var(--dim)",
      transition:"all 0.2s",
    }}>
      <span>{label}</span>
      <span style={{fontWeight:700}}>{value ? "AN" : "AUS"}</span>
    </button>
  );
}

function chip(kind) {
  const base = {
    display:"inline-flex", alignItems:"center", padding:"3px 10px",
    borderRadius:999, fontSize:10, letterSpacing:"0.04em", fontFamily:"inherit",
  };
  const map = {
    gold:   { color:"var(--gold)",   border:"1px solid rgba(255,215,0,0.4)",   background:"rgba(255,215,0,0.06)" },
    cyan:   { color:"var(--cyan)",   border:"1px solid rgba(0,229,255,0.4)",   background:"rgba(0,229,255,0.06)" },
    pink:   { color:"var(--pink)",   border:"1px solid rgba(255,45,154,0.4)",  background:"rgba(255,45,154,0.06)" },
    ok:     { color:"var(--ok)",     border:"1px solid rgba(77,255,155,0.4)",  background:"rgba(77,255,155,0.08)" },
    violet: { color:"var(--violet)", border:"1px solid rgba(167,139,250,0.4)", background:"rgba(167,139,250,0.08)" },
  };
  return { ...base, ...map[kind] };
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

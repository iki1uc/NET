<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>NET – System Online</title>

    <style>
        body { font-family: Arial; background:#0d0d0d; color:#e6e6e6; padding:20px; }
        h1 { color:#4af; }
        button {
            margin:5px; padding:10px 20px; font-size:16px;
            background:#222; color:#fff; border:1px solid #555; cursor:pointer;
        }
        button:hover { background:#333; }
        #id-info {
            margin-top:20px; font-size:20px; padding:15px;
            background:#000; border:1px solid #333; border-radius:8px;
        }
        #monitor, #dashboard {
            margin-top:30px; padding:20px; background:#111;
            border-left:4px solid #4af; border-radius:8px;
        }
    </style>
</head>

<body>
    <h1>NET – System Online</h1>

    <button onclick="showID('koop')">KOOP ID</button>
    <button onclick="showID('neutral')">NEUTRAL ID</button>
    <button onclick="showID('pook')">POOK ID</button>

    <div id="id-info">Noch keine ID ausgewählt.</div>

    <div id="monitor"></div>
    <div id="dashboard"></div>

    <script src="IDkoop.js"></script>
    <script src="IDneutral.js"></script>
    <script src="IDpook.js"></script>
    <script src="NETmonitor.js"></script>
    <script src="NETdashboard.js"></script>

    <script>
        function showID(mode) {
            const map = {
                koop: ID_KOOP,
                neutral: ID_NEUTRAL,
                pook: ID_POOK
            };
            document.getElementById("id-info").innerText = map[mode].info();
        }

        NETmonitor.init("monitor");
        NETdashboard.init("dashboard");

</body>

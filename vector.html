<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>IKI1UC · VECTOR Runtime</title>

<style>
body { background:#000; color:#0f0; font-family:Consolas; padding:20px; }
h1 { color:#6f6; }
pre { background:#111; padding:12px; border:1px solid #333; border-radius:6px; }
</style>

<script type="module">

// =========================
// 0. Connector‑NET (Browser‑kompatibel)
// =========================

const CONNECTOR_NET = {
    mode: "neutral",
    pass(vector) {
        return {
            received: vector,
            time: Date.now(),
            state: "passed-through"
        };
    }
};

// =========================
// 1. Vektor definieren
// =========================

const INIT = [1,0,0];
const QI   = [1,1,0];
const IQQ  = [0,1,1];

const ANKER = {
    vector: {
        init: INIT,
        qi: QI,
        iqq: IQQ,
        state: [QI[0], IQQ[1], INIT[2]]
    }
};

// =========================
// 2. TEAM VECTOR
// =========================

const TEAM_VECTOR = {
    pq: "active",
    pp: "active",
    anchor: ANKER.vector.state
};

// =========================
// 3. CONNECTOR‑NET statt NC.link
// =========================

function sendVector() {
    const out = CONNECTOR_NET.pass({
        vector: ANKER.vector,
        team: TEAM_VECTOR
    });

    document.getElementById("out").textContent =
        JSON.stringify(out, null, 2);
}

// =========================
// 4. Auto‑Runtime
// =========================

setInterval(sendVector, 1000);

</script>
</head>

<body>

<h1>IKI1UC · VECTOR Runtime</h1>
<p>Dieser Tab hält den Vektor‑Zustand aktiv.</p>

<h2>Output</h2>
<pre id="out">Warte…</pre>

</body>
</html>
